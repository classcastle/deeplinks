<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classcastle — Authentication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCFCFA; --surface:#fff; --ink:#18221C; --soft:#5E675F; --line:#D9DDD3;
  --brand:#1F5C3A; --brand-ink:#fff; --tint:#E4F1E6; --board:#17352A; --chalk:#F4D35E;
  color-scheme:light dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1511;--surface:#18211B;--ink:#EEF2EA;--soft:#9EAA9F;--line:#2A362D;--brand:#4DAA72;--brand-ink:#0F1511;--tint:#1A2B20;--board:#1C4030}
}
:root[data-theme="dark"]{--bg:#0F1511;--surface:#18211B;--ink:#EEF2EA;--soft:#9EAA9F;--line:#2A362D;--brand:#4DAA72;--brand-ink:#0F1511;--tint:#1A2B20;--board:#1C4030}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 1.02rem/1.6 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
h1,h2,h3{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:400;margin:0;line-height:1.15}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}

.container{background:var(--surface);border-radius:6px;padding:60px 48px;max-width:440px;width:100%;text-align:center;box-shadow:12px 12px 0 var(--brand)}
.spinner{display:flex;gap:12px;justify-content:center;margin:0 auto 24px}
.spinner span{width:16px;height:16px;background:var(--brand);border-radius:50%;animation:bounce 1.4s ease-in-out infinite}
.spinner span:nth-child(1){animation-delay:-0.32s}
.spinner span:nth-child(2){animation-delay:-0.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.checkmark{width:50px;height:50px;color:var(--brand);margin:0 auto 24px;display:none}
.error-icon{width:50px;height:50px;color:#C53030;margin:0 auto 24px;display:none}
h1{font-size:1.8rem;margin-bottom:0;margin-top:20px;color:var(--ink)}
h1.authenticated{font-size:1.5rem;margin-bottom:16px;margin-top:0}
h1.error{font-size:1.5rem;margin-bottom:16px;margin-top:0;color:#C53030}
p{color:var(--soft);font-size:1rem;line-height:1.6;margin-bottom:20px}
p.error{color:#C53030;font-size:0.9rem}
.success{color:var(--brand);font-size:48px;margin-bottom:20px}
.error{color:#C53030;font-size:48px;margin-bottom:20px}
.btn-primary{background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:600;padding:14px 24px;border-radius:6px;display:inline-block;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn-primary:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

@media (max-width:480px){
  .container{padding:40px 32px}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="container">
  <div class="spinner">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <svg class="checkmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"></polyline>
  </svg>
  <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  <h1>Authenticating</h1>
  <p id="statusText" style="display:none;"></p>
  <a href="#" id="openAppBtn" class="btn-primary" style="display:none;">Open App</a>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  const error = urlParams.get('error');
  const force = urlParams.get('force');

  function showError(title, message) {
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('.error-icon').style.display = 'block';
    const h1 = document.querySelector('h1');
    h1.textContent = title;
    h1.classList.add('error');
    const statusText = document.getElementById('statusText');
    statusText.style.display = 'block';
    statusText.classList.add('error');
    statusText.innerHTML = message;
  }

  const errorMessages = {
    'invalid_token': {
      title: 'Invalid Token',
      message: 'The authentication token is invalid or has been tampered with.<br><br>Please open the Classcastle app and try signing in again. If the problem persists, speak to your teacher or contact your IT administrator / Classcastle support.'
    },
    'token_used': {
      title: 'Token Already Used',
      message: 'This authentication token has already been used. Each token can only be used once for security reasons.<br><br>Please open the Classcastle app and start a new sign-in attempt. If you continue to see this error, speak to your teacher or contact your IT administrator / Classcastle support.'
    },
    'token_expired': {
      title: 'Token Expired',
      message: 'The authentication token has expired. Tokens are only valid for a short time for security reasons.<br><br>Please open the Classcastle app and try signing in again. If the problem persists, speak to your teacher or contact your IT administrator / Classcastle support.'
    },
    'session_expired': {
      title: 'Session Expired',
      message: 'Your authentication session has expired due to inactivity.<br><br>Please open the Classcastle app and try signing in again. If the problem persists, speak to your teacher or contact your IT administrator / Classcastle support.'
    },
    'rate_limit': {
      title: 'Too Many Attempts',
      message: 'You have made too many authentication attempts in a short period. Please wait a few minutes before trying again.<br><br>If you believe this is an error, speak to your teacher or contact your IT administrator / Classcastle support.'
    },
    'invalid_source': {
      title: 'Invalid Source',
      message: 'This page can only be accessed from the Classcastle desktop app.<br><br>Please open the Classcastle app and sign in from there. If you believe this is an error, speak to your teacher or contact your IT administrator / Classcastle support.'
    },
    'network_error': {
      title: 'Network Error',
      message: 'We couldn\'t connect to the authentication server. Please check your internet connection and try again.<br><br>If the problem persists, speak to your teacher or contact your IT administrator / Classcastle support.'
    },
    'server_error': {
      title: 'Server Error',
      message: 'Something went wrong on our end. Our team has been notified.<br><br>Please try again in a few minutes. If the problem persists, speak to your teacher or contact your IT administrator / Classcastle support.'
    },
    'user_cancelled': {
      title: 'Authentication Cancelled',
      message: 'You cancelled the authentication process.<br><br>If you didn\'t intend to cancel, please open the Classcastle app and try signing in again.'
    }
  };

  const defaultError = {
    title: 'Authentication Failed',
    message: 'An unknown error occurred during authentication.<br><br>Please open the Classcastle app and try signing in again. If the problem persists, speak to your teacher or contact your IT administrator / Classcastle support.'
  };

  // Clear URL parameters after reading them
  const cleanUrl = window.location.pathname;
  window.history.replaceState({}, '', cleanUrl);

  // Validation functions
  function validateToken(token) {
    // Check for special characters (only allow alphanumeric)
    const validChars = /^[a-zA-Z0-9]+$/;
    return validChars.test(token);
  }

  function validateSource() {
    const referrer = document.referrer;
    const allowedSources = [
      'https://classcastle.org/oauth/student/continue',
      'http://classcastle.org/oauth/student/continue'
    ];
    return allowedSources.some(source => referrer.startsWith(source));
  }

  function checkRateLimit() {
    const now = Date.now();
    const oneMinute = 60 * 1000;
    const maxAttempts = 5;

    // Get stored attempts
    const attempts = JSON.parse(localStorage.getItem('authAttempts') || '[]');

    // Filter out attempts older than 1 minute
    const recentAttempts = attempts.filter(timestamp => now - timestamp < oneMinute);

    // Check if rate limited
    if (recentAttempts.length >= maxAttempts) {
      return false;
    }

    // Add current attempt
    recentAttempts.push(now);
    localStorage.setItem('authAttempts', JSON.stringify(recentAttempts));

    return true;
  }

  function checkSessionExpiry() {
    const sessionStart = localStorage.getItem('sessionStart');
    if (!sessionStart) {
      // First visit, set session start
      localStorage.setItem('sessionStart', Date.now().toString());
      return true;
    }

    const elapsed = Date.now() - parseInt(sessionStart);
    const thirtySeconds = 30 * 1000;

    if (elapsed > thirtySeconds) {
      return false;
    }

    return true;
  }

  // If force parameter is set, show that error
  if (force) {
    const errorInfo = errorMessages[force] || defaultError;
    showError(errorInfo.title, errorInfo.message);
  } else if (error) {
    const errorInfo = errorMessages[error] || defaultError;
    showError(errorInfo.title, errorInfo.message);
  } else if (id) {
    // Run validations
    if (!validateToken(id)) {
      showError(errorMessages['invalid_token'].title, errorMessages['invalid_token'].message);
    } else if (!validateSource()) {
      showError(errorMessages['invalid_source'].title, errorMessages['invalid_source'].message);
    } else if (!checkRateLimit()) {
      showError(errorMessages['rate_limit'].title, errorMessages['rate_limit'].message);
    } else if (!checkSessionExpiry()) {
      showError(errorMessages['session_expired'].title, errorMessages['session_expired'].message);
    } else {
      console.log('OAuth ID:', id);

      const messages = [
        'Authenticating',
        'Logging your session',
        'Getting ready to open the app'
      ];

      let step = 0;
      const h1 = document.querySelector('h1');

      function showMessage() {
        if (step < messages.length) {
          h1.textContent = messages[step];
          step++;
          setTimeout(showMessage, 800);
        } else {
          // Show authenticated state and button
          document.querySelector('.spinner').style.display = 'none';
          document.querySelector('.checkmark').style.display = 'block';
          h1.textContent = 'Authenticated';
          h1.classList.add('authenticated');
          const statusText = document.getElementById('statusText');
          statusText.style.display = 'block';
          statusText.textContent = 'Authentication successful. Click the button below to return to the Classcastle app.';
          const openAppBtn = document.getElementById('openAppBtn');
          openAppBtn.style.display = 'inline-block';
          openAppBtn.href = `classcastleapp://oauth-callback?id=${id}`;
        }
      }

      showMessage();
    }
  } else {
    showError(
      'Authentication Failed',
      'We couldn\'t find a valid authentication token. This page should only be accessed from the Classcastle desktop app.<br><br>Please open the app and try signing in again. If the problem persists, speak to your teacher or contact your IT administrator / Classcastle support.'
    );
  }
</script>
</body>
</html>
