<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classcastle — Authentication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCFCFA; --surface:#fff; --ink:#18221C; --soft:#5E675F; --line:#D9DDD3;
  --brand:#1F5C3A; --brand-ink:#fff; --tint:#E4F1E6; --board:#17352A; --chalk:#F4D35E;
  color-scheme:light dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1511;--surface:#18211B;--ink:#EEF2EA;--soft:#9EAA9F;--line:#2A362D;--brand:#4DAA72;--brand-ink:#0F1511;--tint:#1A2B20;--board:#1C4030}
}
:root[data-theme="dark"]{--bg:#0F1511;--surface:#18211B;--ink:#EEF2EA;--soft:#9EAA9F;--line:#2A362D;--brand:#4DAA72;--brand-ink:#0F1511;--tint:#1A2B20;--board:#1C4030}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 1.02rem/1.6 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
h1,h2,h3{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:400;margin:0;line-height:1.15}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}

.container{background:var(--surface);border-radius:6px;padding:60px 48px;max-width:440px;width:100%;text-align:center;box-shadow:12px 12px 0 var(--brand)}
.spinner{width:50px;height:50px;border:4px solid var(--tint);border-top:4px solid var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
h1{font-size:1.8rem;margin-bottom:12px;color:var(--ink)}
p{color:var(--soft);font-size:1rem;line-height:1.6}
.success{color:var(--brand);font-size:48px;margin-bottom:20px}
.error{color:#C53030;font-size:48px;margin-bottom:20px}

@media (max-width:480px){
  .container{padding:40px 32px}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="container">
  <div class="spinner"></div>
  <h1>Authenticating</h1>
  <p>Please wait while we complete your authentication...</p>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  if (id) {
    console.log('OAuth ID:', id);
    window.location.href = `classcastleapp://oauth-callback?id=${id}`;
  } else {
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('h1').textContent = 'Error';
    document.querySelector('p').textContent = 'No authentication ID found in the URL.';
  }
</script>
</body>
</html>
